# Builds the portfolio (Astro) and deploys it to GitHub Pages.
# NOT ACTIVE YET. Today the site is a "legacy" Pages build straight from the master branch.
# To switch, in this order:
#   1. Settings -> Pages -> Source -> "GitHub Actions"
#   2. merge this branch into master (or rename master to main and change "branches" below)
# Rollback: revert the merge, then set the source back to "Deploy from a branch" (master, /).
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - name: Build (fails if a page is missing its other-language twin)
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
